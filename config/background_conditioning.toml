# Numerical continuation only: no count search, calibration or chemical grade.
[model]
method = "exact_affine_background_conditioning"
arms = ["native_lm", "unit_box_slsqp", "centered_plane_slsqp"]
repetitions = 2
lm_maxiter = 10000
slsqp_maxeval = 10000
max_time_s = 180.0
x_tol = 1e-8
g_tol = 1e-12
slsqp_ftol_rel = 1e-14
slsqp_xtol_rel = 1e-12
constraint_tolerance = 1e-12
coordinate_roundoff_tolerance = 1e-12
derivative_relative_step = 6.055454452393343e-6
finite_difference_half_step_factor = 0.5
gradient_agreement_atol = 1e-7
gradient_agreement_rtol = 1e-4
stationarity_tolerance = 1e-6
objective_scale_floor = 1e-12
jacobian_rank_rtol = 1e-10
replay_atol = 1e-12
replay_rtol = 1e-10
checkpoints = [0, 300, 1000, 3000, 10000]
evaluation_checkpoints = [1, 300, 1000, 3000, 10000]
background_scaling = "observed_target_population_standard_deviation"

[selection]
input_arm = "global_sigma_max"
input_repetition = 1
cohort_size = 146
case_ranks = [1, 49, 98, 146]
ranking = "ascending_relative_repeat_gcv_difference_then_filename"
count_and_family = "reuse_saved_selected_no_reselection"
start = "same_saved_selected_endpoint_for_all_arms_and_repetitions"
failure_policy = "retain_all_no_retry_no_grade"

[preprocessing]
input = "unchanged_saved_fused_fit_pixels"
physical_config = "unchanged_saved_count_config"
support = "unchanged_saved_axis_support_noise"
