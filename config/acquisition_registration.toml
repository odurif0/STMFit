# One opt-in acquisition experiment; not a replacement production calibration.
# Bounds cover the earlier unlabelled -1.370 nm lag, without per-file expansion.
[model]
method = "signed_row_centered_integer_x_translation"
reference_frame = "forward"

[selection]
bands = 4
min_band_pixels = 256
min_band_rows = 8
min_row_pixels = 16
min_correlation = 0.60
min_distant_peak_gap = 0.01
# One descriptor grid step: nearby peaks are one unresolved spatial neighborhood.
peak_neighborhood_nm = 0.08
max_band_disagreement_nm = 0.08
unresolved_policy = "zero_shift_keep_all_files"

[preprocessing]
max_lag_nm = 2.0
max_lag_width_fraction = 0.25
missing_policy = "restore_raw_mask_before_smoothing"
