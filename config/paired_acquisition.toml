# Bounded exploratory model, not a new molecule calibration.
# Mean gain is one: the molecular amplitude scale cannot drift against gains.
[model]
method = "shared_shape_antisymmetric_gain_plane"
profiles = ["gaussian", "split"]
gain_delta_max = 0.5
background_delta_max_nm = 5.0
tilt_delta_max = 1.0
local_maxiter = 300

[selection]
count_policy = "reuse_saved_N"
family_policy = "valid_minimum_full_parameter_gcv"
validity = "native_mean_and_both_view_residuals"
failure_policy = "report_and_stop_no_partial_grade"

[preprocessing]
support = "original_native_intersect_both_observed"
registration = "reuse_accepted_integer_shifts"
reference_frame = "forward"
