[unary]
state_order = [0, 1]
equal_prior = 0.5
joint_formula = "j_mivc=log(0.5)+log f_mvc(x_iv)"
view_log_evidence_formula = "a_miv=logsumexp_c(j_mivc)"
raw_view_posterior_formula = "pi_mivc=exp(j_mivc-a_miv)"
clip_state_one = "[1e-12,1-1e-12]"
state_zero_is_complement = true
clip_does_not_alter_view_log_evidence = true
available_mask = "C1_training_valid_intersect_node_finite_shared_by_C1_C2"
structural_missing_view = "omit_for_both_models"
partial_view_weight = "1/|A_i|"
model_choice_scope = "fold_wide_never_per_node_mixing"
eta_formula = "eta_mic=(1/|A_i|)sum_v(a_miv+log(pi_clipped_mivc))"
unary_score_formula = "U_mi=logsumexp_c(eta_mic)"
posterior_formula = "q_mic=exp(eta_mic-U_mi)"
empty_mask = "U=0;q=(0.5,0.5);output=?"
empty_mask_incident_edge = "BLOCKED/all_views_missing_incident_edge"
hard_output = "p1>0.5:1;p1<0.5:0;p1==0.5:?"
orientation_authority = "exact_T8_bytes_and_canonical_bundle"

[status]
row_schema = "event|consumed|terminal_status|consequence"
no_terminal_status = "NONE"
terminal_statuses = ["BLOCKED", "FAIL", "SKIPPED", "PASS"]
consumed_invariant = "consumed=true_iff_terminal_status=NONE_and_evaluation_continues;consumed=false_iff_terminal_status_is_terminal_and_returns_immediately"
component_status_rule = "a_consumed_component_may_record_SKIPPED_diagnostically_but_component_status_never_substitutes_evaluator_terminal_status"
unary_rows = ["authority_or_input_mismatch|false|BLOCKED|no_fit", "structural_view_omitted|true|NONE|local_omission", "c1_unavailable|false|SKIPPED|scope_unavailable", "c2_unavailable_fallback_c1|true|NONE|select_C1", "unary_numerical_failure|false|FAIL|no_fallback", "all_views_missing|true|NONE|valid", "all_views_missing_incident_edge|false|BLOCKED|no_fit"]
edge_graph_rows = ["empty_edge_sum|true|NONE|continue_unary_only", "common_null_unavailable|false|SKIPPED|scope_unavailable", "common_null_numerical_failure|false|FAIL|no_fallback", "conditional_unavailable|true|NONE|retain_unary_common_null_graph_zero", "t11_numerical_failure|false|FAIL|no_fallback", "graph_disabled|true|NONE|graph_zero", "t12_failure|false|FAIL|no_fallback", "authority_or_factor_mismatch|false|BLOCKED|before_work"]
final_rows = ["ok|false|PASS|complete_all_guards", "nonpositive_date|false|SKIPPED|first_nonpositive_date", "bootstrap_not_positive|false|SKIPPED|type7_lower_bound_nonpositive", "sign_not_significant|false|SKIPPED|p_ge_0.05", "numerical_failure|false|FAIL|numerical_failure", "incomplete_or_stale_evidence|false|BLOCKED|missing_substituted_duplicate_authority_date_scan_row_receipt"]
precedence = ["BLOCKED", "FAIL", "SKIPPED", "PASS"]

[edge]
eligible_set = "exact_Todo10_eligible_and_all_14_endpoint_predictors_finite"
predictor_names = ["amp_prominence", "amp_neighbor_ratio", "integrated_prominence", "amp_rel", "bwd_neg_com_t", "bwd_neg_diag45", "split_log_skew"]
endpoint_order = "left_then_right_increasing_observed_t_nm"
normalization = "existing_T11_per_scan_normalization"
residualizer = "existing_T11_shared_residualizer"
common_null_fit = "once_per_training_reference_before_conditional_feasibility"
nu = 8
null_score = "N_e=log_t_8(r_e;mu0,S0)"
scale_eigenvalue_floor = 1.0e-4
scale_condition_cap = 1.0e4
scale_check = "eigen(Symmetric(scale)).values"
scale_exception = "none"

[graph_output]
enable_condition = "selected_unary_fit_and_T11_PASS_and_T12_PASS"
selected_model_source = "fold_wide_selected_unary_model_id"
selected_model_allowed = ["C1", "C2"]
selected_unary_fit_source = "outer_fold_selected_unary_fit_sha256"
t11_resolution_key_fields = ["model", "unary_fit_sha256", "fit_role", "scope", "outer_date", "target_date"]
t11_resolution_predicate = "model=selected_model;unary_fit_sha256=selected_unary_fit_sha256;fit_role=partition;scope=outer_score;outer_date=heldout_date;target_date=heldout_date"
t11_resolution_cardinality = 1
t12_fit_sha256_source = "fit_sha256_of_unique_t11_resolution"
t12_reference_key_fields = ["model", "fit_sha256", "fit_role", "scope", "outer_date", "target_date"]
t12_reference_predicate = "model=selected_model;fit_sha256=t12_fit_sha256;fit_role=partition;scope=outer_score;outer_date=heldout_date;target_date=heldout_date"
t12_reference_cardinality = 1
reference_alias_policy = "fit_sha256_only_model_only_first_reference_final_lodo_and_report_total_resolution_forbidden"
block_key_fields = ["model", "fit_sha256", "fit_role", "scope", "outer_date", "target_date", "file", "date", "segment_id"]
block_file_cardinality = "every_selected_block_contains_nodes_and_factors_from_exactly_one_scan_file_and_heldout_date"
scan_logz = "sum_log_evidence_of_only_blocks_matching_exact_reference_and_scan_file_date"
reference_selection = "one_T12_reference_per_held_out_target_date"
reference_scope = "fit_role=partition;scope=outer_score;outer_date=target_date=held_out_date"
reference_integrity = "missing_duplicate_extra_mismatch_BLOCKED"
disabled_logz = 0.0
enabled_probabilities = "T12_marginals"
disabled_probabilities = "selected_unary_q"
node_cardinality = "every_node_exactly_once"
factor_cardinality = "every_eligible_edge_exactly_once"
split_isolated = "unary_only"
exact_half_output = "?"

[scoring]
edge_set = "E_s_fixed_exact_Todo10_eligible_finite_14_predictors"
denominator = "M_s=nodes_s+|E_s|"
denominator_positive = true
c1_score = "L_C1=sum_i(U_C1_i)+sum_e(N_e)"
meta_score = "L_meta=sum_i(U_selected_i)+sum_e(N_e)+I_graph*logZ_T12_s"
scan_difference = "D_s=(L_meta-L_C1)/M_s"
inner_c2_difference = "D_unary_s=(sum_i(U_C2_i)-sum_i(U_C1_i))/M_s"
same_observations_null_denominator = true
t12_role = "relative_graph_normalizer_only"

[gate]
bootstrap_count = 500
seed_start = 0
seed_stop = 499
rng = "one_Random.MersenneTwister(Int(seed))_per_replicate"
iteration_order = "dates_ascending_then_scans_ascending"
resampling = "paired_precomputed_D_s_scan_indices_with_replacement_within_date_original_count"
aggregation = "mean_scans_per_date_then_mean_dates"
quantile_method = "Type7_h=1+(n-1)p;j=floor(h);gamma=h-j;Q=(1-gamma)x_j+gamma*x_(j+1)"
quantile_lower_p = 0.025
quantile_500_result = "0.525*x_(13)+0.475*x_(14)"
quantile_strict = true
inner_c2_requirements = "every_inner_date_mean>0_and_type7_lower_bound>0"
sign_dates = "sorted_dates_bit_order"
sign_masks = "0:2^K-1;bit1=+1;bit0=-1;all_positive=2^K-1"
sign_observed = "Tobs=mean(d_k)"
sign_mask_score = "Tmask=mean(sign*d)"
sign_tail = "Float64_inclusive_Tmask>=Tobs"
sign_p = "count/2^K"
sign_plus_one = false
primary_alpha = 0.05
pass_requirements = "p<0.05_and_every_date_mean>0_and_final_type7_lower_bound>0"

[metrics]
coverage = "mean_all_nodes(A_i_nonempty_and_final_p1!=0.5)"
entropy_probability = "final_p1=T12_marginal_p1_if_graph_enabled_else_selected_unary_q1"
entropy_scope = "every_frozen_node_in_all_scored_outer_scans_including_all_views_missing"
entropy_node_formula = "H_i=-(p_i*log(p_i)+(1-p_i)*log(1-p_i))/log(2);0log0=0"
entropy_aggregation = "sum_i(H_i)/count_all_frozen_nodes_pooled;no_scan_date_or_chain_reweighting"
entropy_empty_scope = "BLOCKED"
view_agreement_probability = "selected_fold_model_pregraph_unclipped_raw_view_posterior_pi_miv1"
view_agreement_pair_scope = "unordered_pairs_v_lt_w_in_config_view_order_with_v_and_w_both_in_A_i"
view_agreement_pair_formula = "(pi_iv1-0.5)*(pi_iw1-0.5)>0"
view_agreement_ties = "nonagreement"
view_agreement_aggregation = "sum_i(agreeing_pairs_i)/sum_i(available_unordered_pairs_i)_pooled;never_mean_node_ratios"
view_agreement_denominator_zero = "NA_retain_integer_numerator_and_denominator"
unary_parameter_count = "76=16+20+20+20"
residualizer_parameter_count = "30=15x2"
null_parameter_count = "5=2+3"
conditional_edge_parameter_count = "9=6+3"
graph_new_parameter_count = 0
unary_meta_total = 111
graph_meta_total = 120
selection_role = "descriptive_only_never_BIC_AICc_GCV"

[serialization]
float_format = "%.17g"
missing_token = "NA"
encoding = "UTF-8"
line_ending = "LF"
final_lf = true
boolean_format = "lowercase"
integer_format = "canonical_base10_no_plus_no_leading_zeros"
ordering = "dates_scans_views_nodes_date_file_t_nm_lobe_Todo10_edges_seed_0_499_sign_mask_ascending"
replay_excludes = "timestamp_absolute_root_machine_temp_paths"

[validation]
validator_version = "structured_evaluator_policy_correction2_v1"
snapshot_authority_once = true
canonical_repo_relative_paths = true
regular_distinct_files = true
reject_symlink_roots_ancestors_members = true
verify_snapshot_before_return = true
recompute_bundle_members = true
fail_before_work_on_authority_failure = true
allowed_reasons = ["policy_encoding_mismatch", "policy_schema_mismatch", "policy_type_mismatch", "policy_value_mismatch", "authority_binding_mismatch", "authority_path_invalid", "authority_symlink", "authority_hardlink", "authority_identity_collision", "authority_path_mismatch", "authority_hash_mismatch", "authority_bundle_mismatch", "authority_member_hash_mismatch", "authority_snapshot_changed", "runtime_version_mismatch", "todo_state_mismatch", "todo13_product_present", "scope_violation", "replay_mismatch", "manifest_mismatch", "t12_reference_mismatch", "metric_replay_mismatch", "bootstrap_replay_mismatch", "sign_replay_mismatch"]
structured_result = "status_reason_counters_and_canonical_replay"
invalid_mutation_work = "status_BLOCKED_exact_reason_formula_bootstrap_sign_graph_metric_output_counters_zero"
