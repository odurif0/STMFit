# Saved-orbital sensitivity only; no SCF, mold or recognition selection.
[model]
qe_version = "7.4.1"
baseline_run = "qe/vacuum_wavefunctions_20260925"
candidate_run = "qe/density_cutoff_20260926"
reference_settings = "config/qe_vacuum_wavefunctions.toml"
ecutrho_ry = [360.0, 720.0]
ecutwfc_ry = 50.0
functional = "PBE"
sample_bias_ry = -0.0220495933
spectral_window = "sharp_zero_temperature"
scf_acceptance_ry = 5e-5

[selection]
policy = "paired_saved_orbitals_no_mold_or_benchmark_selection"
require_exact_baseline_replay = true
require_exact_parallel_repeat = true
adopt_reference = false

[preprocessing]
half_nm = 0.32
step_nm = 0.04
diagnostic_heights_nm = [0.4, 0.5, 0.6]
fourier_block_points = 32
geometry_rtol = 1e-12
atom_position_atol_nm = 1e-12
clip_density = false
normalize_density = false
