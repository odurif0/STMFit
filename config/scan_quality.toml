knots = [0.969, 2.896, 4.7162, 5.8721, 6.785, 7.986, 8.931, 9.8191, 10.7498, 11.7777, 12.586, 13.6083, 14.886, 16.3028, 17.6088, 19.809, 21.3412, 24.0416, 29.2748, 35.246, 216.618]
