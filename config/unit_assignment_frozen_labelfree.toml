# Campaign A (2026-10-21): fully frozen, label-free unit assignment. Every
# part learned across scans (empirical Fisher per lobe parity, k-means
# centroids, GMM components, physical naming, fusion emission rates) is
# learned once on a reference cohort fixed by a label-free rule, then applied
# unchanged to any scan (src/frozen_assignment.jl: train_reference_model,
# apply_reference_model). Reference rule: corroborated scans, at most
# reference_max_scans_per_track per molecule track (repeat scans of one
# molecule are not independent), first in file-name order. No class fraction
# is carried from the reference: equal GMM weights and fusion prior 0.5.
# Features, views, seeds and numerics are those of the promoted
# corroborated config.
[model]
gmm_learning_family = "gaussian"
gmm_covariance_scope = "final_only"
gmm_hard_assignment = "mahalanobis"
gmm_learning_maxiter = 200
gmm_learning_tolerance = 1e-6
gmm_learning_min_mass = 1e-12
gmm_covariance_structure = "full"
fisher_score_center = "training_mean"
gmm_final_score = "mahalanobis"
gmm_final_covariance = "ridge"
gmm_covariance_ridge = 1e-6
fisher_projection_zero_l1 = 1e-12
mold_margin_mode = "absolute_cost_margin"
name = "cc_soft_patch_support_frozen_labelfree_v1"
descriptor = "affine_residual_half_plane_asymmetry"
descriptor_column = "patch_u_asym_reconstructed"
descriptor_channel = "bwd_res"
descriptor_half_nm = 0.32
descriptor_step_nm = 0.08
descriptor_zero_l1 = 1e-12
split_skew_ratio_max = 2.0
mold_half_nm = 0.32
mold_step_nm = 0.04
mold_target_height_nm = 0.50
mold_z_min_nm = -0.5
mold_z_max_nm = 2.6
mold_z_step_nm = 0.005
mold_isovalue_min_log10 = -5.5
mold_isovalue_max_fraction = 0.8
mold_isovalue_count = 80
mold_calibration = "first_below_target"
fisher_pca_components = 10
fisher_noise_regularization = 0.01
fisher_gmm_regularization = 0.001
fisher_gmm_maxiter = 300
fisher_gmm_tolerance = 0.001
fisher_seed = 0
# Latent-class fusion EM for the emission rates (as config/molecule_consensus.toml).
fusion_em_max_iter = 500
fusion_em_tol = 1e-10
fusion_init_pi = 0.5
fusion_init_theta0 = 0.1
fusion_init_theta1 = 0.9

[selection]
fisher_cv_scheme = "lobe_parity"
fisher_scan_split_seed = 0
gmm_cluster_naming = "raw_amplitude"
gmm_resampling = "none"
gmm_seed_aggregation = "hard_vote"
gmm_training_weighting = "equal_lobes"
assignment_training_support = "all_admissible"
assignment_training_scans = "corroborated_counts"
kmeans_seeds = 20
gmm_seeds = 10
first_seed = 0
gmm_selftrain = 2
interactions = true
vote_threshold = 0.5
# Frozen model: learned on a reference cohort, applied unchanged.
assignment_model = "frozen_reference"
fusion = "latent_class"
fusion_min_scans = 3
# Emission rates from the reference sessions' per-scan calls; neutral prior at
# application (0.5: no class fraction assumed).
fusion_emission_source = "reference_sessions_all_scans"
fusion_prior_pi = 0.5
# Reference cohort (label-free rule) and frozen parts.
reference_scans = "corroborated_counts"
reference_max_scans_per_track = 5
reference_scan_order = "file_name"
frozen_fisher = "reference_lobe_parity"
frozen_gmm_weights = "equal"

[preprocessing]
gmm_feature_normalization = "mean_sample_std"
gmm_scale_fallback = 1.0
assignment_patch_support = "complete_disk_symmetric"
fisher_patch_projection = "none"
patch_residual_filter = "smooth_residual"
descriptor_normalization = "median_sample_std"
pixel_order = "u_outer_t_inner"
fisher_layout = "legacy_row_major"
