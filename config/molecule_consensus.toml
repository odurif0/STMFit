# Repeated-scan molecule grouping and count consensus (label-free).
# Fixed before any benchmark grade of this stage. See docs/src/selection.md.

[model]
# Absolute-frame registration window centred on the earlier scan's chain.
window_half_nm = 3.0
# Resampling step: finer than one chitosan lobe width, coarser than 512-px pixels.
grid_step_nm = 0.04
# Structure broader than about half a lobe spacing (tilt, substrate terraces)
# is removed before correlation.
highpass_sigma_nm = 0.32
# Largest admitted drift between two consecutive scans.
max_shift_nm = 1.6
coarse_step_px = 4
# Registered support for a consensus refit that fails on the scan's own ROI:
# crop to the registered reference footprint plus this margin (about two lobe
# spacings of background for the unchanged ROI detection and flattening).
roi_margin_nm = 1.2
# Latent-class fusion EM (test/build_molecule_fusion.jl). Neutral start: class 1
# is the component whose scans mostly call 1; the fit is start-independent on the
# benchmark cohort.
fusion_em_max_iter = 500
fusion_em_tol = 1e-10
fusion_init_pi = 0.5
fusion_init_theta0 = 0.1
fusion_init_theta1 = 0.9

[selection]
# Normalized cross-correlation threshold: independent structures correlate
# near zero; an unchanged molecule close to one. The observed benchmark pair
# distribution (label-free) has an empty gap between 0.39 and 0.55.
ncc_min = 0.5
min_overlap_px = 500
max_center_distance_nm = 6.0
# A consensus needs repeated evidence: at least three scans of the molecule.
min_track_scans = 3
majority = "strict"
# Every lobe of the registered reference footprint must be at least this far
# inside the target scan (about half a lobe spacing).
frame_margin_nm = 0.3
# Repeat-scan collection for application cohorts (test/collect_repeat_scans.jl):
# same session, acquired within this many minutes of a target, frame centre
# within this distance, and no overview frame larger than this range.
collect_max_gap_min = 30.0
collect_max_offset_nm = 5.0
collect_max_range_nm = 20.0
# Fuse per-scan unit calls over a molecule track: binomial latent-class model
# (detection rate, false-call rate, mixing weight fitted by EM, no labels).
# Physical lobes observed in fewer scans keep their per-scan call.
fusion = "latent_class"
fusion_min_scans = 3

[preprocessing]
channel = "Z"
flatten = "plane+rows"
