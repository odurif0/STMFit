# Attribution of the accepted potential; no new functional or physical cutoff.
[model]
qe_version = "7.4.1"
qe_source_commit = "500de340b820e1cb8c05f2d8bb8fced102f377c1"
source_run = "qe/vacuum_potential_20260926"
functional = "internal_nonmagnetic_PBE_1_4_3_4"
components = ["rho_valence", "rho_xc_input", "grad2_xc_input", "gga_active", "lda", "gga_local", "gga_divergence"]
scf_acceptance_ry = 5e-5

[selection]
policy = "all_native_planes_and_source_gga_branches_no_physical_selection"
require_total_reference_exact = true
require_density_control_exact = true
require_component_repeat_exact = true
adopt_reference = false
modify_density = false
propagate_wavefunctions = false

[preprocessing]
rho_threshold_lda = 1e-10
rho_threshold_gga = 1e-6
gradient_squared_threshold_gga = 1e-10
native_significant_digits = 10
cube_significant_digits = 5
addition_roundoff_ulps = 64
normalize_components = false
clip_density = false
