# One fixed local-tangent score experiment, not a new production calibration.
[model]
basis = "target_gaussian_affine"
rank_rtol = 1e-12
zero_norm_rtol = 1e-12

[selection]
# Exactly the existing connected-mold pixel-count guard; no relaxation.
minimum_observed_pixels = 5
minimum_observed_fraction = 0.5

[preprocessing]
sampling = "native_box_bilinear"
