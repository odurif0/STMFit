# Fixed-geometry residual subtraction only. No outer optimizer is called.
[model]
[selection]
[preprocessing]

[cross_view_residual]
validity = "native_fused_mean"

# Identical numerical controls to the previous frozen-amplitude experiment.
[counting_variable_projection]
outer_maxeval = 800
outer_maxtime_s = 30.0
outer_xtol_rel = 1e-6
outer_ftol_rel = 1e-9
linear_maxiter = 1000
linear_kkt_atol = 1e-12
linear_kkt_rtol = 1e-10
linear_bound_atol = 1e-12
linear_svd_rtol = 1e-12
mapping_atol = 1e-10
mapping_rtol = 1e-10
native_elliptical_maxiter = 50
