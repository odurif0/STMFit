# STMFit counting config — Chitosan 10–20mer, decoupled supports (declared 2026-10-25)
# Identical to config/chitosan_10_20mer_adaptive_support_rescue.toml except: N is
# counted on the capped support (support_threshold_rule = "half_maximum_cap"), and
# every later fixed-N refit uses the legacy support (geometry_support_threshold_rule),
# or the capped one where that fit fails. See docs/src/journal.md, 2026-10-25.

[model]
n_min = 2
n_max = 24
spacing_min_nm = 0.35
spacing_max_nm = 0.75
max_overlap = 0.60
sigma_parallel_min_nm = 0.191
sigma_parallel_max_nm = 0.509
fit_width_nm = 0.16

# First-pass support detection
support_noise_k = 2.5
support_padding_nm = 0.25
support_min_length_nm = 1.0
support_baseline_quantile = 0.10
support_threshold_rule = "half_maximum_cap"
geometry_support_threshold_rule = "profile_quantile_noise"
support_threshold_fraction = 0.5

# Adaptive support rescue pass
adaptive_rescue_support_noise_k = 1.5
adaptive_rescue_support_padding_nm = 0.75
adaptive_rescue_min_support_gain_nm = 0.75
adaptive_rescue_feasible_margin = 0
adaptive_rescue_max_circ_ell_delta = 1

global_maxtime = 0.0
global_maxiter = 10000
max_iter = 300
multistart = 1

selection_criterion = "gcv"
cv_method = "gcv"
selection_policy = "adaptive_support_rescue"
cv_folds = 5
bic_cv_margin = 100
cv_ratio_threshold = 2.0

kappa_max = 10.0
kappa_weight = 1.0
min_amplitude_fraction = 0.3

chain_tilted_baseline = true
chain_circular_sigmas = false

[selection]
gcv_ambiguity_rel_threshold = 0.05
robust_guard_nu = 8.0

[preprocessing]
stride = 1
flatten = "plane+rows"
smooth_radius_px = 1
