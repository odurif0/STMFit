# Conditional second job: only after all direct-image identifiability checks pass.
[model]
method = "zero_image_fixed_and_free_translation"
start_seeds = [0, 11, 29, 47]
start_unit_box_radius = 0.02
slsqp_maxeval = 2000
max_time_s = 120.0

[selection]
file = "240817_006.sxm"
count_policy = "reuse_native_diagnostic_N"
start_policy = "minimum_training_rss_then_existing_validity"
family_policy = "valid_minimum_full_parameter_gcv"
image_policy = "require_all_image_folds_identified"
free_image_agreement_px = 0.25
free_fold_agreement_px = 0.25
shift_interior_margin_px = 0.001
holdout_policy = "both_folds_improve_paired_rss"
failure_policy = "explicit_no_retry_no_partial_grade"

[preprocessing]
input = "verified_saved_registered_fit_pixels"
support = "reuse_all_observed_pixels_without_resampling"
window_and_folds = "reuse_image_registration_settings"
reference_frame = "forward"
background_coordinates = "observed_grid_in_both_views"
noise = "reuse_native_noise"
