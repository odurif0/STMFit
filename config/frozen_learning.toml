# Attribution only, using the first complete observed-fit execution unchanged.
[model]
method = "native_saved_input_learning_counterfactual"
repetitions = 2
assignment_config = "unit_assignment_patch_support.toml"

[selection]
input_policy = "first_observed_fit_execution_all_keys"
path = ["control", "local_only", "fisher", "normalization", "observed"]
reverse_control = "reverse_local_only"
require_exact_native_reapplication = true
grade_policy = "external_after_complete_verification"

[preprocessing]
local_inputs = "saved_unmodified"
normalization = "captured_per_scan_per_feature"
missing_features = "native_abstention_no_imputation"
