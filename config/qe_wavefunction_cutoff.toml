# Two bounded SCFs; no mold or recognition selection.
[model]
qe_version = "7.4.1"
baseline_run = "qe/cutoff_wavefunctions_20260927"
baseline_scf_run = "qe/density_cutoff_20260926"
ecutwfc_ry = [50.0, 60.0]
ecutrho_ry = 720.0
functional = "PBE"
scf_acceptance_ry = 5e-5
sample_bias_ry = -0.0220495933
spectral_window = "sharp_zero_temperature"
startingpot = "atomic"
startingwfc = "atomic+random"
scf_max_seconds = 12600

[selection]
policy = "two_point_wavefunction_sensitivity_no_mold_or_benchmark_selection"
require_exact_baseline_replay = true
require_exact_parallel_repeat = true
adopt_reference = false

[preprocessing]
half_nm = 0.32
step_nm = 0.04
diagnostic_heights_nm = [0.4, 0.5, 0.6]
fourier_block_points = 32
geometry_rtol = 1e-12
atom_position_atol_nm = 1e-12
clip_density = false
normalize_density = false
