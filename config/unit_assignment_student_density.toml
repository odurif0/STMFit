# Fixed Student learning with the same Student density for hard assignment and final scoring.
[model]
gmm_learning_family = "student_t"
gmm_covariance_scope = "final_only"
gmm_hard_assignment = "student_density"
gmm_factor_rank = 4
gmm_student_df = 5.0
gmm_learning_maxiter = 200
gmm_learning_tolerance = 1e-6
gmm_learning_min_mass = 1e-12
gmm_learning_cholesky_guard = 1e-8
gmm_covariance_structure = "full"
fisher_score_center = "training_mean"
gmm_final_score = "student_density"
gmm_final_covariance = "ridge"
gmm_covariance_ridge = 1e-6
fisher_projection_zero_l1 = 1e-12
mold_margin_mode = "absolute_cost_margin"
name = "cc_soft_student_density_v1"
descriptor = "affine_residual_half_plane_asymmetry"
descriptor_column = "patch_u_asym_reconstructed"
descriptor_channel = "bwd_res"
descriptor_half_nm = 0.32
descriptor_step_nm = 0.08
descriptor_zero_l1 = 1e-12
split_skew_ratio_max = 2.0
mold_half_nm = 0.32
mold_step_nm = 0.04
mold_target_height_nm = 0.50
mold_z_min_nm = -0.5
mold_z_max_nm = 2.6
mold_z_step_nm = 0.005
mold_isovalue_min_log10 = -5.5
mold_isovalue_max_fraction = 0.8
mold_isovalue_count = 80
mold_calibration = "first_below_target"
fisher_pca_components = 10
fisher_noise_regularization = 0.01
fisher_gmm_regularization = 0.001
fisher_gmm_maxiter = 300
fisher_gmm_tolerance = 0.001
fisher_seed = 0

[selection]
fisher_cv_scheme = "lobe_parity"
fisher_scan_split_seed = 0
gmm_cluster_naming = "raw_amplitude"
gmm_resampling = "none"
gmm_bootstrap_replicates = 1
gmm_bootstrap_seed = 0
gmm_seed_aggregation = "hard_vote"
gmm_training_weighting = "equal_lobes"
assignment_training_support = "all_admissible"
kmeans_seeds = 20
gmm_seeds = 10
first_seed = 0
gmm_selftrain = 2
interactions = true
vote_threshold = 0.5

[preprocessing]
gmm_feature_normalization = "mean_sample_std"
gmm_scale_fallback = 1.0
assignment_patch_support = "complete_disk_symmetric"
fisher_patch_projection = "none"
patch_residual_filter = "smooth_residual"
descriptor_normalization = "median_sample_std"
pixel_order = "u_outer_t_inner"
fisher_layout = "legacy_row_major"
