# Separate experiment after the incomplete spectral-window run.
# This is not a model-selection, calibration or production assignment config.
[model]
qe_version = "7.4.1"
qe_commit = "500de340b820e1cb8c05f2d8bb8fced102f377c1"
sample_bias_ry = -0.0220495933
spectral_window = "sharp_zero_temperature"
scf_acceptance_ry = 5e-5
control_plot_num = 5
candidate_plot_num = 10

[selection]
policy = "no_mold_or_benchmark_selection"
require_archived_control_sha256 = true
require_patched_repeat_sha256 = true
ildos_integral_rtol = 1e-4
cube_significant_digits = 5
numeric_roundoff_atol = 1e-13

[preprocessing]
cube_order = "qe_last_axis_fast"
clip_negative_values = false
# Exact historical lateral grid, from unit_assignment_patch_support.toml.
half_nm = 0.32
step_nm = 0.04
diagnostic_heights_nm = [0.40, 0.50, 0.60]
