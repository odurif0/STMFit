# Diagnostic of accepted-state potentials, not a new STM observable.
[model]
qe_version = "7.4.1"
source_run = "qe/substrate_reference_20260925"
sample_bias_ry = -0.0220495933
spectral_window = "sharp_zero_temperature"
scf_acceptance_ry = 5e-5
total_plot_num = 1
electrostatic_plot_num = 11
glcn_density_sha256 = "0636e18139cc6809be398eec5455153f3d32850437aa547f342c57a59ce299d1"
glcnac_density_sha256 = "448de1eaea9760a222dcc994349684dcad38ff75202369285e12a1b15a0103ba"

[selection]
policy = "all_native_planes_and_selected_bands_no_matching_plane_adoption"
whole_plane_domain = "strict_between_all_periodic_paw_bounding_planes"
report_lower_geometric_half = true
require_exact_total_repeat = true
adopt_reference = false
propagate_wavefunctions = false

[preprocessing]
primary_values = "native_filplot_first_axis_fast_with_padding"
independent_values = "cube_last_axis_fast"
coordinates = "accepted_xml_cell_substrate_normal"
potential_units = "rydberg_energy"
xml_energy_units = "hartree"
native_significant_digits = 10
cube_significant_digits = 5
native_alat_decimal_places = 8
native_tau_decimal_places = 9
cube_header_decimal_places = 6
geometry_rtol = 1e-12
numeric_roundoff_atol_ry = 1e-13
clip_potential = false
normalize_potential = false
