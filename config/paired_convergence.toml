# Budget-only diagnostic at the same fixed starts and observed pixels.
[model]
method = "native_lsqfit_finite_difference"
control_maxiter = 300
extended_maxiter = 10000
max_time_s = 600.0
# Explicitly retain the installed LsqFit 0.16 defaults; do not loosen them.
x_tol = 1e-8
g_tol = 1e-12
checkpoints = [0, 300, 1000, 3000, 10000]
finite_difference_relative_step = 6.055454452393343e-6
finite_difference_half_step_factor = 0.5
gradient_agreement_atol = 1e-7
gradient_agreement_rtol = 1e-4
stationarity_tolerance = 1e-6
objective_scale_floor = 1e-12
jacobian_rank_rtol = 1e-10
replay_atol = 1e-12
replay_rtol = 1e-10

[selection]
file = "240817_006.sxm"
count_policy = "reuse_native_diagnostic_N"
family_policy = "valid_minimum_full_parameter_gcv"
convergence_policy = "report_lm_stop_and_independent_box_stationarity_separately"
failure_policy = "explicit_no_retry_no_partial_grade"

[preprocessing]
input = "verified_saved_registered_fit_pixels"
support = "reuse_native_frame_and_bounds"
noise = "reuse_native_noise"
