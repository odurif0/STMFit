# Two-point diagnostic; neither cutoff is selected by recognition labels.
[model]
qe_version = "7.4.1"
baseline_run = "qe/xc_build_recheck_20260926"
stock_pp = "qe/xc_build_control_20260926/binaries/pp_stock.x"
baseline_ecutrho_ry = 360.0
candidate_ecutrho_ry = 720.0
ecutwfc_ry = 50.0
functional = "PBE"
scf_acceptance_ry = 5e-5
sample_bias_ry = -0.0220495933
startingpot = "atomic"
startingwfc = "file"
scf_max_seconds = 9900

[selection]
policy = "two_point_sensitivity_no_cutoff_or_mold_selection"
require_collected_converged_state = true
require_exact_total_repeat = true
adopt_reference = false
propagate_wavefunctions = false

[preprocessing]
domain = "all_native_planes_with_unchanged_geometry_only_gap_tags"
cross_grid_interpolation = false
clip_density = false
normalize_density = false
