# Diagnostic raw-image transfer, not a production counting/assignment config.
[model]
observable = "fixed_continuous_surface_local_height"
height_reference = "lowest_copper_atom"
interpolation = "bilinear_certified_grid_heights"
surface_run = "qe/vacuum_continuous_20260925"
glcn_surface_sha256 = "ad70c4e0734a766a54dd16d0bb1a01e776a52353487c6d8e51280447566dd0fc"
glcnac_surface_sha256 = "ddef1a0b71e07d8aef0fbb9b69311591b11dfa992bd58bdbc2bcd0c04b953c47"
glcn_xml_sha256 = "0cbcb7f6b1f533c24b4e05f08f5bb5b279eb9255d4c0ac04e445c04d69b057c8"
glcnac_xml_sha256 = "3b25c35dad13754f505b0b923ec8845c3304e6a84b11f40cf0f90c2710ccc124"
glcn_frame_sha256 = "b40436964c90d30bf8358a9f2f1906dd78f89d37552fd5b3fd03d3c75ee8b8ea"
glcnac_frame_sha256 = "a2db0644d7139ffe804c1077ba64a52793b9d838ba4155eda0c28f0f8a8d4af4"
map_half_nm = 0.32
map_step_nm = 0.04
intervals = [1, 2, 3]
sample_bias_v = -0.300
bias_atol_v = 1e-6
rotation_step_deg = 15.0
translations_nm = [-0.08, 0.0, 0.08]
height_gain = 1.0
photometry = "one_common_offset_per_source_scan"
arms = ["common", "chemical"]

[selection]
policy = "report_all_isovalues_no_grade_no_promotion"
patch_radius_nm = 0.16
anchor_bright_quantile = 0.70
anchor_hf_mad_multiplier = 3.0
anchor_plateau = "connected_eight_neighbor_centroid"
min_patch_pixels = 25
# Same image-only integer-registration checks as acquisition_registration.toml.
bands = 4
min_band_pixels = 256
min_band_rows = 8
min_row_pixels = 16
min_correlation = 0.60
min_distant_peak_gap = 0.01
peak_neighborhood_nm = 0.08
max_band_disagreement_nm = 0.08
unresolved_policy = "zero_shift_keep_all_files"

[preprocessing]
channel = "Z"
stride = 1
fit_flatten = "plane"
anchor_flatten = "plane+rows"
anchor_smooth_radius_px = 1
plane_rank_rtol = 1e-12
calibration_block_rows = 32
holdout_buffer_rows = 1
max_lag_nm = 2.0
max_lag_width_fraction = 0.25
missing_policy = "observed_only_no_imputation"
target_correction = "calibration_rows_only_difference_plane"
