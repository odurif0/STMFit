# Image-only feasibility, not a production deconvolution or chemical model.
[model]
method = "mirrored_first_order_phase_transfer"
mean_lag_px = [0.0, 0.5, 1.0, 2.0, 3.0, 4.0]
kernel_tail_l1 = 1e-12
residual_shift_max_px = 4.0
residual_shift_step_px = 0.5
gain_min = 0.5
gain_max = 1.5
negative_control = "reversed_scan_direction"

[selection]
panel_quantiles = [0.0, 0.25, 0.5, 0.75, 1.0]
panel_policy = "sorted_acquisition_filenames_without_labels"
candidate_policy = "minimum_training_bidirectional_contrast_rss"
min_pixels = 4096
min_rows = 32
min_pixels_per_row = 16
min_heldout_gain_fraction = 0.01
min_reverse_advantage_fraction = 0.01
lag_agreement_px = 0.5
shift_agreement_px = 1.0
min_supporting_scans = 3
failure_policy = "report_all_scans_no_retuning_no_partial_grade"

[preprocessing]
input = "unsmoothed_native_z_actual_observation_masks"
registration = "reuse_saved_integer_x_shifts"
support = "common_observed_sources_for_all_candidates_both_directions"
contrast = "within_row_centered_on_common_support"
holdout_band_rows = 64
holdout_buffer_rows = 5
noise = "no_noise_calibration_or_independence_claim"
