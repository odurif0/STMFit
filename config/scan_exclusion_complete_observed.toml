# Only observation-defined complete scans teach the shared learners.
# All targets remain evaluated, including partial scans; target never teaches.
[model]
method = "native_saved_input_leave_one_scan_out"
repetitions = 2
assignment_config = "unit_assignment_patch_support.toml"

[selection]
input_policy = "first_observed_fit_execution_all_keys"
arms = ["control", "observed"]
training_cohort = "fully_observed_fwd_bwd"
exclude_from = ["fisher", "gmm", "kmeans", "cluster_naming"]
fisher_inner_folds = "unchanged_lobe_parity"
require_exact_native_reapplication = true
grade_policy = "external_after_complete_verification"

[preprocessing]
local_inputs = "saved_unmodified"
normalization = "each_scan_own_unlabelled_features"
missing_features = "native_abstention_no_imputation"
