# Check the three saved representative surfaces, not a new current search.
[model]
qe_version = "7.4.1"
qe_commit = "500de340b820e1cb8c05f2d8bb8fced102f377c1"
sample_bias_ry = -0.0220495933
spectral_window = "sharp_zero_temperature"
scf_acceptance_ry = 5e-5
observable = "gamma_wavefunction_sum_outside_paw"

[selection]
policy = "continuous_unique_descending_saved_representatives"
domain = "unchanged_molecular_half_native_endpoints"
require_reference_sha256 = true
require_exact_repeat = true
repeat_scope = "interval_roots_and_direct_surface_values"
require_outside_paw = true
interval_arithmetic_version = "1.0.12"
taylor_order = 12
root_width_nm = 1e-7
max_depth = 24
max_nodes = 20000
newton_steps = 32
numeric_roundoff_atol = 1e-13
geometry_rtol = 1e-12

[preprocessing]
coordinates = "accepted_xml_cell_substrate_normal"
harmonics = "all_stored_gamma_pairs"
clip_negative_values = false
normalize_components = false
half_nm = 0.32
step_nm = 0.04
fourier_block_points = 32
