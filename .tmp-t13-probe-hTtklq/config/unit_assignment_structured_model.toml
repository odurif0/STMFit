[model]
schema = "structured_label_free_unit_assignment_model_v2"
version = 2
model_ids = ["C1", "C2", "edge_admission", "admitted_graph"]
reference_model_id = "C1"
challenger_model_id = "C2"
edge_admission_model_id = "edge_admission"
admitted_graph_model_id = "admitted_graph"
reference_family = "two_component_diagonal_gaussian"
challenger_family = "two_component_diagonal_student_t"
node_priors = [0.5, 0.5]
mixture_weights = [0.5, 0.5]
mixture_weight_policy = "fixed_not_estimated"
covariance = "diagonal"
covariance_floor = 1.0e-4
student_t_nu = 8
n_starts = 5
unary_start_quantile_deltas = [0.25, 0.40, 0.45, 0.475, 0.49]
max_iter = 200
tol = 1.0e-6
objective_decrease_tolerance = 1.0e-10
physical_orientation_feature = "amplitude"

[model.views]
names = ["base_local", "base_local+bwd_neg_com_t", "base_local+bwd_neg_diag45", "base_local+split_log_skew"]
base_local = ["amp_prominence", "amp_neighbor_ratio", "integrated_prominence", "amp_rel"]
backward_descriptors = ["bwd_neg_com_t", "bwd_neg_diag45"]
split_descriptor = ["split_log_skew"]
fusion = "equal_logit_mean"
fixed_equal_weights = [0.25, 0.25, 0.25, 0.25]
missing_view_policy = "marginalize_and_report_count"
all_views_missing_posterior = [0.5, 0.5]
all_views_missing_score_increment = 0.0

[model.edge]
basis = ["corr_fwd", "corr_bwd"]
dimension = 2
category_order = ["00", "01", "10", "11"]
student_t_nu = 8
conditional_start_alphas = [0.0, 0.25, 0.5, 0.75, 1.0]
mixed_state_mean = "tied_01_10"
scale = "shared_full_2x2"
scale_shrink_target = "state_independent_null"
scale_shrinkage_formula = "lambda=min(0.5,3/N_edges)"
eigenvalue_floor = 1.0e-4
condition_number_cap = 1.0e4
edge_weight = 1.0
pair_prior = [0.0, 0.0, 0.0, 0.0]
pair_prior_policy = "zero_data_independent"
responsibility_policy = "frozen_unary_soft_pairs_only"
pair_weight_formula = "w_ec=q_left(c_left)*q_right(c_right)"
kish_ess_formula = "ESS_c=(sum_e(w_ec)^2)/sum_e(w_ec^2)"
fixed_weight_objective = "Q=sum_e,c(w_ec*log_t_nu(r_e;mu_c,Sigma))"
heldout_gain_formula = "g_e=sum_c(w_ec*(log_t_nu(r_e;mu_c,Sigma)-log_t_nu(r_e;mu0,S0)))"
max_iter = 200
tol = 1.0e-6
objective_decrease_tolerance = 1.0e-10
start_tie_tolerance = 1.0e-12
start_tie_policy = "lower_configured_alpha"

[model.graph]
inference = "exact_log_domain_two_state_chain"
enable_condition = "verified_edge_admission_pass"
eligible_edge_factor = "conditional_log_density_minus_state_independent_log_density"
split_gap_policy = "split_graph_and_keep_nodes_unary"
isolated_node_policy = "unary_only"
reversal_equivariance_required = true

[selection]
schema = "structured_label_free_unit_assignment_selection_v2"
version = 2
meta_algorithm = "nested_C1_C2_edge_admission_admitted_graph"
common_reference = "C1_with_state_independent_edge_null"
unary_fallback = "C1"
edge_fallback = "selected_unary_without_graph"
terminal_outcomes = ["PASS", "FAIL", "BLOCKED", "SKIPPED", "FOLLOWUP_REQUIRED"]
heldout_partition = "whole_date"
scan_aggregation = "equal_scans_within_date"
date_aggregation = "equal_dates"

[selection.bootstrap]
count = 500
seed_start = 0
seed_stop = 499
seed_family = "integer_range_0_499"
resample_unit = "whole_scan_within_date"
edge_shuffle_count = 500
edge_shuffle_seed_start = 0
edge_shuffle_seed_stop = 499
edge_shuffle_seed_family = "integer_range_0_499"
sign_flip = "exhaustive_all_date_sign_assignments"

[selection.scoring]
observation_count_formula = "M_s=nodes_s+eligible_edges_s"
scan_score_formula = "D_s=(loglik_meta(s)-loglik_C1(s))/M_s"
node_only_edge_score = "training_fitted_state_independent_edge_null"
score_every_frozen_node = true
score_every_eligible_edge = true
all_view_abstention_score_increment = 0.0
all_view_abstention_posterior = [0.5, 0.5]
numerical_failure = "FAIL"

[selection.unary_gate]
comparison = "C2_minus_C1"
nested_inner_leave_date_out = true
every_inner_date_mean_positive = true
bootstrap_lower_quantile = 0.025
bootstrap_lower_bound_strictly_positive = true
failure_fallback = "C1"

[selection.edge_gate]
comparison = "conditional_edge_density_minus_state_independent_edge_null"
nested_inner_leave_date_out = true
every_inner_date_mean_positive = true
bootstrap_lower_quantile = 0.025
bootstrap_lower_bound_strictly_positive = true
shuffle_upper_quantile = 0.975
observed_above_shuffle_quantile = true
reversal_equivariance_required = true
failure_fallback = "selected_unary_without_graph"

[selection.primary_test]
single_primary_test = true
claim = "nested_meta_algorithm_improves_common_C1_reference"
date_statistic = "d_k=mean_scan_in_date(D_s)"
observed_statistic = "T_obs=mean_k(d_k)"
sign_statistic = "T_epsilon=mean_k(epsilon_k*d_k)"
p_value_rule = "count(T_epsilon>=T_obs)/2^K"
ties_in_tail = true
monte_carlo_plus_one = false
alpha = 0.05
per_date_positive_guard = true

[selection.noninferiority]
loss_formula = "L_s(m,q)=1-mean_i(hard_m(i,q)==hard_m(i,unperturbed))"
difference_formula = "L_s(candidate,q)-L_s(C1,q)"
resample_unit = "paired_whole_scan"
bootstrap_upper_quantile = 0.975
maximum_allowed_loss_difference = 0.0
seed_restart_reported_separately = true

[selection.feasibility]
minimum_dates = 5
minimum_scans = 20
minimum_category_kish_ess = 10.0
minimum_distinct_edges = 90
minimum_support_scans_per_training_date = 3
effective_observations_per_free_parameter = 10.0
edge_scale_eigenvalue_floor = 1.0e-4
edge_scale_condition_number_cap = 1.0e4
insufficient_outcome = "SKIPPED"

[selection.diagnostics]
follow_up_only = true
mechanisms = ["mfa_q1", "scan_effects", "view_asymmetry"]
allowed_outcomes = ["FOLLOWUP_REQUIRED", "SKIPPED", "BLOCKED"]
outer_training_partitions_only = true
multiple_testing = "Holm"
permutation_count = 200
permutation_upper_quantile = 0.975
view_interval_level = 0.95
null_campaign_count = 500
null_campaign_min_dates = 5
null_campaign_min_scans = 20
null_campaign_chain_length_min = 4
null_campaign_chain_length_max = 8
clopper_pearson_confidence = 0.95
clopper_pearson_upper_max = 0.05

[selection.diagnostics.policy]
schema = "structured_diagnostics_policy_v1"
residual_model = "fixed_nu8_diagonal_student_t_two"
residual_formula = "x_minus_posterior_weighted_component_mean"
residual_fallback = "matched_one_component_student_t_mean"
residual_failure = "BLOCKED"
icc_estimator = "ICC_1_1_oneway_random_unbalanced"
icc_date_centering = "row_weighted_per_date_per_feature"
icc_feature_pooling = "equal_feature_summed_squares"
icc_unbalanced_group_size = "n0=(N-sum(n_s^2)/N)/(K-1)"
view_score = "mean_lobes(log_predictive_density/dimension)"
view_contrast = "mean(bwd_com,bwd_diag)-mean(base,split)"
channel_drop_features = ["bwd_neg_com_t", "bwd_neg_diag45"]
channel_drop_refit = "fresh_inner_training_base_local"
channel_drop_statistic = "mean(full_bwd_scores)-refit_base_score"
channel_drop_same_sign = "strict_nonzero_each_inner_date"
quantile_method = "Hyndman_Fan_type_7_explicit"
permutation_tail = "upper_inclusive_plus_one"
view_tail = "two_sided_zero_inclusive_plus_one"
threshold_equality = "SKIPPED"
holm_order = ["mfa_q1", "scan_effects", "view_asymmetry"]
holm_reject_equality = true

[preprocessing]
schema = "structured_label_free_unit_assignment_preprocessing_v2"
version = 2
normalization = "per_scan_median_mad"
normalization_scope = "each_scan_uses_only_its_own_lobes"
spacing_source = "config/chitosan.toml"
spacing_min_nm = 0.35
spacing_max_nm = 0.75
gap_policy = "consecutive_observed_t_nm_only"
channel = "Z"
stride = 1
flatten = "plane+rows"
smooth_radius_px = 1

[preprocessing.patch]
basis = ["corr_fwd", "corr_bwd"]
half_t_nm = 0.32
half_u_nm = 0.32
step_nm = 0.04
pixels_per_axis = 17
pixels = 289
order = "u_outer,t_inner"
coordinates_nm = [-0.32, -0.28, -0.24, -0.20, -0.16, -0.12, -0.08, -0.04, 0.00, 0.04, 0.08, 0.12, 0.16, 0.20, 0.24, 0.28, 0.32]
forward_prefix = "res_p"
backward_prefix = "bwd_res_p"
grid_sha256 = "d281d836d4bc5a1657762a46bc2ee0ff51ff9b3a4aff6068dee55632797d950e"
centering = "per_lobe_channel_arithmetic_mean"
scaling = "per_lobe_channel_unit_l2"
l2_norm_floor = 1.0e-12
correlation_roundoff_tolerance = 1.0e-12
serialization_format = "%.17g"
reversal_index_formula = "R(k)=17*(u_idx-1)+(18-t_idx)"

[preprocessing.patch_producers]
forward_source = "test/extract_lobe_patches.jl"
forward_source_sha256 = "f79258197cd123f833e0541647c4e7107044149deb558ba765fbeee0545737ad"
forward_command = "julia --project=$ROOT $ROOT/test/extract_lobe_patches.jl --features $FEATURES --data-dir $DATA --half-nm 0.32 --half-u-nm 0.32 --step-nm 0.04 --out $FWD"
backward_source = "test/extract_lobe_patches_bwd.jl"
backward_source_sha256 = "4f866a1e27289a0cf010a6ed4b5e0b92454dc55f97807d33cc95edb9e87182ba"
backward_command = "julia --project=$ROOT $ROOT/test/extract_lobe_patches_bwd.jl --features $FEATURES --data-dir $DATA --half-nm 0.32 --step-nm 0.04 --out $BWD"
execution_site = "Viper_Slurm_compute_node"
julia_threads = 1
producer_value_normalization = "(v-median)/sample_std_corrected"
producer_nonpositive_std_fallback = 1.0
producer_serialization_format = "%.7g"
interpolation = "bilinear"
out_of_bounds = "NaN"
forward_residual = "smoothed_forward_Z_minus_complete_forward_fitted_plane_plus_gaussians"
backward_residual = "smoothed_backward_Z_minus_complete_forward_fitted_plane_plus_gaussians"

[preprocessing.residualization]
features = ["amp_prominence", "amp_neighbor_ratio", "integrated_prominence", "amp_rel", "bwd_neg_com_t", "bwd_neg_diag45", "split_log_skew"]
endpoint_order = "left_then_right_in_increasing_observed_t_nm"
design = "X=[ones x_left x_right]"
intercept_penalized = false
predictor_count = 14
ridge_formula = "max(1e-12,1e-6*trace(X[:,2:end]'*X[:,2:end])/14)"
coefficient_formula = "B=(X'X+R)\\(X'Y)"
heldout_residual_formula = "[corr_fwd,corr_bwd]-[1;x_left;x_right]'*B"
fit_scope = "training_fold_edges_only"
