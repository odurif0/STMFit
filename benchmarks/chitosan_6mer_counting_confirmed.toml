# Expanded chitosan 6mer counting benchmark manifest.
#
# External grading only: never read this from fitting or model-selection code.
# Every row was manually/visually confirmed as expected_N=6 for counting.
# Unit-assignment control is NKNNKN for external grading only; per-row
# unit_sequence_available records explicit TSV provenance, not whether the method may
# use the control. Fitting/selection/assignment must never read these labels.

[benchmark]
name = "chitosan_6mer_counting_confirmed"
system = "chitosan on Cu(100)"
data_dir_env = "STMFIT_DATA_DIR"
default_config = "config/chitosan.toml"
primary_result = "N_eff"
selection_policy = "No expected-N prior; labels are external grading only."
source_review = "benchmarks/chitosan_6mer_preassignment_review.tsv"
notes = "Unified 6mer benchmark list from confirmed expected_N=6 review rows; the same 145-file set is used for counting and 0/1/? unit assignment. Unit control is NKNNKN for external grading only and must not enter fitting, selection, assignment, threshold choice, abstention, or calibration."

[quality_classes]
clean_target = "Confirmed chitosan 6mer target with expected N=6."
excluded = "Excluded from strict benchmark scoring."

[evaluation]
grade_only_manifest_files = true
primary_exclude_quality = ["excluded"]
stress_quality = []
report_columns = ["N_selected", "N_eff", "N_ell", "N_circ", "ambiguous_eff", "artifact_fwd_bwd_corr"]

