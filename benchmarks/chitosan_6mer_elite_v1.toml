# Provisional elite subset of the full 6-mer set (v1, 2026-10-25): the top third of the frozen quality score.
# Derived from the v2 manifest (2026-10-19):
#
# External grading only: never read this from fitting or model-selection code.
# Files: the 145 graded scans of chitosan_6mer_counting_confirmed.toml (cohort full145), 240310_Cu100009 and the
# 2024 candidates validated on 2026-10-19 (added_2024), and the 2025 Cu(100) candidates (added_2025). Each shows one
# intact (NKN)2 molecule by visual review; the unit control is NKNNKN (6 units) for every file. Keys are the names
# of data/sets/6mer_Cu100_benchmark; raw_path is the file under data/raw/. Built from benchmarks/chitosan_6mer_cu100_triage.tsv.

[benchmark]
name = "chitosan_6mer_elite_v1"
system = "chitosan on Cu(100)"
default_config = "config/chitosan.toml"
selection_policy = "No expected-N prior; labels are external grading only."
notes = "167 scans: the provisional elite subset (2026-10-25, top third of the frozen image-quality score among the 492-scan full set; arbitrary size, to be redone against human quality grades). Cohorts: {'added_2024': 72, 'full145': 37, 'added_2025': 58}. Repeat scans of one molecule are not independent; report per molecule too."

[quality_classes]
clean_target = "Confirmed chitosan 6mer target with expected N=6."
excluded = "Excluded from strict benchmark scoring."

[evaluation]
grade_only_manifest_files = true
primary_exclude_quality = ["excluded"]
stress_quality = []
report_columns = ["N_selected", "N_eff", "N_ell", "N_circ", "ambiguous_eff", "artifact_fwd_bwd_corr"]

