[benchmark]
name = "chitosan_6mer_full_v1"
system = "chitosan on Cu(100)"
default_config = "config/chitosan.toml"
selection_policy = "No expected-N prior; labels are external grading only."
notes = "492 scans: the full 6-mer set (user decision 2026-10-25): every scan of chitosan_6mer_benchmark_v2.toml except 240307_019 (several objects). full145 144, added_2024 260, added_2025 88. The elite subset is still to be defined; chitosan_6mer_optimization_v1.toml (419 scans) is only what the current automatic rule accepts. Repeat scans of one molecule are not independent; report per molecule too."

[quality_classes]
clean_target = "Confirmed chitosan 6mer target with expected N=6."
excluded = "Excluded from strict benchmark scoring."

[evaluation]
grade_only_manifest_files = true
primary_exclude_quality = ["excluded"]
stress_quality = []
report_columns = ["N_selected", "N_eff", "N_ell", "N_circ", "ambiguous_eff", "artifact_fwd_bwd_corr"]

